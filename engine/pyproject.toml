[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "tm-engine"
version = "0.1.0"
description = "Terraforming Mars rules engine (Rust, built with PyO3)"
requires-python = ">=3.14"

[tool.maturin]
module-name = "tm_engine"

# Rebuild the engine whenever its Rust source changes, so `uv run` always uses current rules.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }, { file = "tm_engine.pyi" }]
